<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Looks | Daya</title>
  <meta name="description" content="Browse outfits by body type and occasion.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="looks">
  <main id="main">
    <div class="wrap">
      <div class="page-head">
        <h1 class="page-title" id="looks-title">All looks</h1>
        <p class="lede" id="looks-desc"></p>
      </div>

      <div class="steps">
        <div class="step" id="step-occ">
          <h2 class="step-title"><span class="step-num">1</span> What are you dressing for?</h2>
          <div class="chips" id="occ-chips" role="group" aria-label="Occasion"></div>
        </div>
        <div class="step" id="step-body" hidden>
          <h2 class="step-title"><span class="step-num">2</span> Your body type</h2>
          <div class="chips" id="body-chips" role="group" aria-label="Body type"></div>
          <p class="step-note"><a href="calculator.html">Not sure of your body type? Use the body calculator</a></p>
        </div>
        <p class="step-prompt" id="looks-prompt" aria-live="polite"></p>
        <div><button type="button" class="linklike" id="f-reset">Start again</button></div>
      </div>

      <p class="result-count" id="looks-count" aria-live="polite"></p>
      <div class="grid four" id="looks-grid"></div>

      <div class="empty" id="looks-empty" hidden>
        <h2>No looks here yet</h2>
        <p>We haven’t added a look for that combination. Try another occasion or body type, or chat with a stylist below and we’ll find something for you.</p>
      </div>
    </div>
  </main>
  <script src="content.js"></script>
  <script src="layout.js"></script>
  <script src="pages.js"></script>
</body>
</html>
