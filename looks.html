<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Looks | Daya</title>
  <meta name="description" content="Browse outfits by body type and occasion.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Cormorant+Garamond:wght@500;600;700&family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="looks">
  <main id="main">
    <div class="wrap">
      <div class="page-head">
        <h1 class="page-title" id="looks-title">All looks</h1>
        <p class="lede" id="looks-desc"></p>
      </div>
    </div>
    <div class="filter-bar" role="search" aria-label="Filter looks">
      <div class="wrap filter-inner">
        <div class="fb-field"><label for="f-occ">Occasion</label><select id="f-occ"></select></div>
        <div class="fb-field"><label for="f-body">Body type</label><select id="f-body"></select></div>
        <div class="fb-field"><label for="f-sort">Sort by</label>
          <select id="f-sort">
            <option value="">Our picks</option>
            <option value="low">Lowest price</option>
            <option value="high">Highest price</option>
            <option value="deal">Biggest saving</option>
          </select>
        </div>
        <button type="button" class="linklike fb-reset" id="f-reset">Clear all</button>
      </div>
    </div>
    <div class="wrap">
      <p class="step-note"><a href="calculator.html">Not sure of your body type? Use the body calculator</a></p>
      <p class="step-prompt" id="looks-prompt" aria-live="polite"></p>

      <p class="result-count" id="looks-count" aria-live="polite"></p>
      <div class="grid four" id="looks-grid"></div>

      <div class="empty" id="looks-empty" hidden>
        <h2>No looks here yet</h2>
        <p>We haven’t added a look for that combination. Try another occasion or body type, or chat with a stylist below and we’ll find something for you.</p>
      </div>
    </div>
  </main>
  <script src="boot.js"></script>
</body>
</html>
